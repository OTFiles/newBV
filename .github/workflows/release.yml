name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    if: github.repository == 'OTFiles/newBV'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release preconditions
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          NOTES=".github/release-notes/${TAG}.md"
          if [ ! -f "$NOTES" ]; then
            # 本 fork 不强制要求逐步维护发版摘要，缺失时只提示
            echo "::warning::未找到发版摘要 $NOTES，将使用自动生成的 changelog"
          fi

          PREV="$(git tag --sort=-v:refname | grep -vxF "$TAG" | head -n 1 || true)"
          if [ -n "$PREV" ]; then
            HIGHEST="$(printf '%s\n%s\n' "$PREV" "$TAG" | sort -V | tail -n 1)"
            if [ "$HIGHEST" != "$TAG" ]; then
              echo "::error::tag $TAG 不大于已有最新 tag $PREV"
              exit 1
            fi
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        run: |
          set -euo pipefail
          # runner 已预装 Android SDK；android-actions/setup-android 会去装已被移除的 tools 包
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$SDK_ROOT" -name sdkmanager -type f | head -n 1)
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools" 2>&1 | tail -5 || true
          echo "sdk.dir=$SDK_ROOT" > local.properties

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode signing config
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${SIGNING_KEYSTORE_BASE64:-}" ]; then
            echo "::warning::未配置签名 secret，release APK 将未签名（无法直接安装）"
            exit 0
          fi
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > key.jks
          # 用 printf 而不是 heredoc：脚本在 run: 块里带缩进，
          # heredoc 会把缩进空格一起写进 properties 文件导致解析失败
          {
            echo "releaseStoreFile=key.jks"
            echo "releaseStorePassword=${SIGNING_STORE_PASSWORD}"
            echo "releaseKeyAlias=${SIGNING_KEY_ALIAS}"
            echo "releaseKeyPassword=${SIGNING_KEY_PASSWORD}"
          } > signing.properties

      - name: Configure app crash token
        env:
          CRASH_REPORT_TOKEN: ${{ secrets.CRASH_REPORT_TOKEN }}
        run: |
          if [ -z "$CRASH_REPORT_TOKEN" ]; then
            echo "::warning::未配置 CRASH_REPORT_TOKEN，崩溃上传将不可用"
          else
            echo "crashReport.token=$CRASH_REPORT_TOKEN" >> local.properties
          fi

      - name: Build release APK
        env:
          NEWBV_VERSION_BASE: ${{ github.ref_name }}
        run: |
          export NEWBV_VERSION_BASE="${NEWBV_VERSION_BASE#v}"
          ./gradlew assembleRelease

      - name: Parse version
        run: |
          META=app/build/outputs/apk/release/output-metadata.json
          echo "versionCode=$(jq -r '.elements[0].versionCode' "$META")" >> "$GITHUB_ENV"
          echo "versionName=$(jq -r '.elements[0].versionName' "$META")" >> "$GITHUB_ENV"

      # WORKER_ADMIN_TOKEN 为 Worker 管理端 ADMIN_TOKEN；APK 内使用的是 CRASH_REPORT_TOKEN
      # 崩溃上报后端属于上游（Frost819）自建服务，本 fork 不拥有，
      # 因此不再上传 mapping。如需启用，请换成自己的端点并配置 WORKER_ADMIN_TOKEN。
      - name: Upload mapping to crash backend (skipped)
        if: false
        run: echo "crash backend disabled in this fork"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: newBV_${{ env.versionName }}
          path: app/build/outputs/apk/release/newBV_${{ env.versionCode }}_${{ env.versionName }}_release.apk

      - name: Generate release body
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 .github/scripts/generate_release_body.py release_body.md

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/newBV_${{ env.versionCode }}_${{ env.versionName }}_release.apk
          tag_name: ${{ github.ref_name }}
          name: newBV ${{ env.versionName }}
          body_path: release_body.md
          draft: false
          prerelease: false
